apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: platform
servers: 1
agents: 0
ports:
  # Traefik ingress (bundled with k3s) -> http://*.localhost:8088
  - port: 8088:80
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --disable=metrics-server
        nodeFilters: [server:*]
