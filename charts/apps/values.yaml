# Images are built locally and imported into k3d by scripts/up.ps1, hence pullPolicy Never.
# Each service may read one database password from Secret postgres-credentials (created by the infra chart)
# as $(DB_PASSWORD), usable inside other env values.
services:
  orderflow-api:
    image: orderflow-api:dev
    migrationsImage: orderflow-api-migrations:dev
    dbPasswordKey: orderflow-password
    ingressHost: orderflow.localhost
    metricsPath: /metrics
    probes: { live: /health/live, ready: /health/ready }
    env:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__OrderFlow: Host=postgres;Database=orderflow;Username=orderflow;Password=$(DB_PASSWORD);GSS Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:9092
      OpenApi__Enabled: "true"

  orderflow-consumer:
    image: orderflow-consumer:dev
    migrationsImage: orderflow-consumer-migrations:dev
    metricsPath: /metrics
    dbPasswordKey: orderflow-password
    probes: { live: /health/live, ready: /health/ready }
    env:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConsumerDb: Host=postgres;Database=orderflow_consumer;Username=orderflow;Password=$(DB_PASSWORD);GSS Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:9092
      Warehouse__BaseUrl: http://orderflow-warehouse:8080/

  orderflow-warehouse:
    image: orderflow-warehouse-stub:dev
    probes: { live: /health/live, ready: /health/live }
    env:
      ASPNETCORE_ENVIRONMENT: Production

  payledger:
    image: payledger:dev
    dbPasswordKey: payledger-password
    ingressHost: payledger.localhost
    metricsPath: /actuator/prometheus
    probes: { live: /actuator/health/liveness, ready: /actuator/health/readiness }
    resources:
      limits: { memory: 768Mi }
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payledger
      SPRING_DATASOURCE_PASSWORD: $(DB_PASSWORD)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

defaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
