{{- /* Generate passwords once; reuse them on every upgrade. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres-credentials" }}
{{- $users := list }}
{{- range .Values.postgres.databases }}{{ $users = append $users .user }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
  postgres-password: {{ randAlphaNum 24 | b64enc }}
  {{- range ($users | uniq) }}
  {{ . }}-password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
