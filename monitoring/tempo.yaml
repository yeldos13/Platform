tempo:
  # OTLP only; services export traces directly, no collector in between.
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
  retention: 48h
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
